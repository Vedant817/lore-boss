name: Verify Lore Boss
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # VS 2022 remains compatible with the bundled node-gyp native build.
        # docs: https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
        os: [ubuntu-latest, windows-2022]
        node: [22, 24]
    env:
      LB_BROWSER_PORT: '3162'
    steps:
      # Official action tag v7 resolved to these immutable commit IDs during setup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run guardrails
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run test:browser
      - if: failure()
        name: Locate browser failure evidence
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'LB_BROWSER_ARTIFACTS='+require('node:path').join(require('node:os').tmpdir(), 'loreboss-playwright-3162')+'\n')"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.LB_BROWSER_ARTIFACTS }}
          retention-days: 7
          if-no-files-found: warn
